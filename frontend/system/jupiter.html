<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupiter 8K | CosMos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
    <script src="../homepage/errorHandler.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        canvas { display: block; outline: none; }
        .exit-btn {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(16px); padding: 10px 20px; border-radius: 30px; color: white;
            text-decoration: none; font-weight: 500; font-size: 14px;
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .exit-btn:hover { background: rgba(217, 119, 6, 0.4); transform: translateY(-2px); border-color: #fcd34d; }
        #ui-panel {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 16px; padding: 25px; color: white; width: 300px; z-index: 100;
        }
        #ui-panel h2 {
            margin: 0 0 15px 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px;
            background: linear-gradient(135deg, #fcd34d, #d97706);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        #ui-panel p { margin: 8px 0; font-size: 14px; color: #cbd5e1; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        #ui-panel p strong { color: #fff; }
        .info-desc {
            font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 15px 0;
            padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px;
            border-left: 3px solid #fcd34d;
        }
        .controls-group { margin-top: 20px; }
        .controls-group label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; color: #fff; margin-bottom: 10px; }
        .btn-action {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 16px; border-radius: 8px; cursor: pointer;
            transition: all 0.3s ease; width: 100%; margin-top: 10px; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .btn-action:hover { background: rgba(217, 119, 6, 0.4); border-color: #fcd34d; }
        #loading {
            position: absolute; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center;
            color: #fcd34d; font-family: 'Space Grotesk', sans-serif; font-size: 24px; letter-spacing: 2px; transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="loading">OBSERVING STORMS...</div>
    <a href="../homepage/main.html" class="exit-btn"><i class="fa-solid fa-arrow-left"></i> Return to Hub</a>
    
    <div id="ui-panel">
        <h2>Jupiter</h2>
        <div class="info-desc">The largest planet in the solar system, a sprawling gas giant characterized by its iconic Great Red Spot and turbulent cloud bands.</div>
        <p><span>Diameter</span> <strong>139,820 km</strong></p>
        <p><span>Gravity</span> <strong>24.79 m/s²</strong></p>
        <p><span>Distance from Sun</span> <strong>778M km</strong></p>
        <p><span>Cloud Top Temp</span> <strong>-108°C</strong></p>
        
        <div class="controls-group">
            <label><input type="checkbox" id="showMoons" checked> Show Galilean Moons</label>
            <label><input type="checkbox" id="autoRotate" checked> Auto Rotation</label>
            <button class="btn-action" id="resetCam">Reset View</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.minDistance = 8; controls.maxDistance = 80;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); 
        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.2);
        sunLight.position.set(15, 5, 10);
        scene.add(ambientLight, sunLight);

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(5000 * 3);
        for(let i=0; i<15000; i++) starPos[i] = (Math.random()-0.5) * 1500;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.6, transparent: true, opacity: 0.8}));
        scene.add(stars);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('Anonymous');
        
        let planet, moonsMesh;

        textureLoader.load('https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/jupitermap.jpg', (colorTex) => {
            planet = new THREE.Group();
            scene.add(planet);

            const material = new THREE.MeshStandardMaterial({
                map: colorTex, roughness: 0.7, metalness: 0.0
            });
            const ground = new THREE.Mesh(new THREE.SphereGeometry(6, 128, 128), material);
            planet.add(ground);

            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
        });

        // 4 Galilean Moons (Io, Europa, Ganymede, Callisto)
        const moonGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xddccbb, roughness: 0.9 });
        moonsMesh = new THREE.InstancedMesh(moonGeo, moonMat, 4);
        scene.add(moonsMesh);

        const dummy = new THREE.Object3D();
        const moonData = [
            { radius: 8, speed: 0.02, offset: 0 },
            { radius: 10, speed: 0.015, offset: Math.PI/2 },
            { radius: 14, speed: 0.01, offset: Math.PI },
            { radius: 18, speed: 0.007, offset: Math.PI*1.5 }
        ];

        const showMoons = document.getElementById('showMoons');
        const autoRotate = document.getElementById('autoRotate');
        document.getElementById('resetCam').addEventListener('click', () => {
            camera.position.set(0, 5, 25); controls.target.set(0,0,0);
        });
        showMoons.addEventListener('change', e => {
            moonsMesh.visible = e.target.checked;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            if (planet && autoRotate.checked) planet.rotation.y += 0.003; // Jupiter rotates very fast
            
            if (showMoons.checked) {
                for(let i=0; i<4; i++) {
                    const d = moonData[i];
                    dummy.position.set(Math.cos(time*d.speed + d.offset)*d.radius, 0, Math.sin(time*d.speed + d.offset)*d.radius);
                    dummy.updateMatrix();
                    moonsMesh.setMatrixAt(i, dummy.matrix);
                }
                moonsMesh.instanceMatrix.needsUpdate = true;
            }
            
            stars.rotation.y += 0.0001;
            controls.update(); renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
