<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars 8K | CosMos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
    <script src="../homepage/errorHandler.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        canvas { display: block; outline: none; }
        .exit-btn {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(16px); padding: 10px 20px; border-radius: 30px; color: white;
            text-decoration: none; font-weight: 500; font-size: 14px;
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .exit-btn:hover { background: rgba(239, 68, 68, 0.4); transform: translateY(-2px); border-color: #fca5a5; }
        #ui-panel {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 16px; padding: 25px; color: white; width: 300px; z-index: 100;
        }
        #ui-panel h2 {
            margin: 0 0 15px 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px;
            background: linear-gradient(135deg, #fca5a5, #ef4444);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        #ui-panel p { margin: 8px 0; font-size: 14px; color: #cbd5e1; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        #ui-panel p strong { color: #fff; }
        .info-desc {
            font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 15px 0;
            padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px;
            border-left: 3px solid #fca5a5;
        }
        .controls-group { margin-top: 20px; }
        .controls-group label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; color: #fff; margin-bottom: 10px; }
        .btn-action {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 16px; border-radius: 8px; cursor: pointer;
            transition: all 0.3s ease; width: 100%; margin-top: 10px; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .btn-action:hover { background: rgba(239, 68, 68, 0.4); border-color: #fca5a5; }
        #loading {
            position: absolute; inset: 0; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center;
            color: #fca5a5; font-family: 'Space Grotesk', sans-serif; font-size: 24px; letter-spacing: 2px; transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="loading">MAPPING MARTIAN SURFACE...</div>
    <a href="../homepage/main.html" class="exit-btn"><i class="fa-solid fa-arrow-left"></i> Return to Hub</a>
    
    <div id="ui-panel">
        <h2>Mars</h2>
        <div class="info-desc">A dusty, cold desert world with a very thin atmosphere. It features massive extinct volcanoes and a gigantic canyon system.</div>
        <p><span>Diameter</span> <strong>6,779 km</strong></p>
        <p><span>Gravity</span> <strong>3.72 m/s²</strong></p>
        <p><span>Distance from Sun</span> <strong>228M km</strong></p>
        <p><span>Surface Temp</span> <strong>-153°C to 20°C</strong></p>
        
        <div class="controls-group">
            <label><input type="checkbox" id="showOrbits" checked> Show Phobos/Deimos Orbits</label>
            <label><input type="checkbox" id="autoRotate" checked> Auto Rotation</label>
            <button class="btn-action" id="resetCam">Reset View</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.minDistance = 6; controls.maxDistance = 60;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        sunLight.position.set(10, 5, 5);
        scene.add(ambientLight, sunLight);

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(5000 * 3);
        for(let i=0; i<15000; i++) starPos[i] = (Math.random()-0.5) * 1000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8}));
        scene.add(stars);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('Anonymous');
        
        let planet, phobos, deimos;
        const phobosOrbitLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(Array.from({length: 101}, (_, i) => new THREE.Vector3(Math.cos(i/100*Math.PI*2)*6.5, 0, Math.sin(i/100*Math.PI*2)*6.5))),
            new THREE.LineBasicMaterial({color: 0x555555, transparent: true, opacity: 0.5})
        );
        const deimosOrbitLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(Array.from({length: 101}, (_, i) => new THREE.Vector3(Math.cos(i/100*Math.PI*2)*10, 0, Math.sin(i/100*Math.PI*2)*10))),
            new THREE.LineBasicMaterial({color: 0x444444, transparent: true, opacity: 0.4})
        );
        scene.add(phobosOrbitLine, deimosOrbitLine);

        Promise.all([
            new Promise(res => textureLoader.load('https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/marsmap1k.jpg', res)),
            new Promise(res => textureLoader.load('https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/marsbump1k.jpg', res))
        ]).then(([colorTex, normalTex]) => {
            planet = new THREE.Group();
            scene.add(planet);

            const material = new THREE.MeshStandardMaterial({
                map: colorTex, bumpMap: normalTex, bumpScale: 0.05,
                roughness: 0.8, metalness: 0.1
            });
            const ground = new THREE.Mesh(new THREE.SphereGeometry(5, 128, 128), material);
            planet.add(ground);

            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
                fragmentShader: `varying vec3 vNormal; void main() { float intensity = pow(0.6 - dot(vNormal, vec3(0,0,1)), 3.0); gl_FragColor = vec4(1.0, 0.4, 0.2, 1.0) * intensity; }`,
                blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true
            });
            const atmos = new THREE.Mesh(new THREE.SphereGeometry(5.2, 64, 64), atmosMat);
            planet.add(atmos);

            phobos = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15, 1), new THREE.MeshStandardMaterial({color: 0x887766, roughness: 0.9}));
            deimos = new THREE.Mesh(new THREE.DodecahedronGeometry(0.1, 1), new THREE.MeshStandardMaterial({color: 0x998877, roughness: 0.9}));
            scene.add(phobos, deimos);

            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
        });

        const showOrbits = document.getElementById('showOrbits');
        const autoRotate = document.getElementById('autoRotate');
        document.getElementById('resetCam').addEventListener('click', () => {
            camera.position.set(0, 3, 16); controls.target.set(0,0,0);
        });
        showOrbits.addEventListener('change', e => {
            phobosOrbitLine.visible = deimosOrbitLine.visible = e.target.checked;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            if (planet && autoRotate.checked) planet.rotation.y += 0.001;
            if (phobos) {
                phobos.position.set(Math.cos(time * 0.5) * 6.5, Math.sin(time*0.1)*0.2, Math.sin(time * 0.5) * 6.5);
                phobos.rotation.y += 0.01;
            }
            if (deimos) {
                deimos.position.set(Math.cos(time * 0.2) * 10, Math.sin(time*0.05)*0.5, Math.sin(time * 0.2) * 10);
                deimos.rotation.y += 0.005;
            }
            stars.rotation.y += 0.0001;
            controls.update(); renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
