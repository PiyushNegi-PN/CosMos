<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Lost in Space | CosMos</title>
  <link rel="stylesheet" href="homepage/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #030014 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }
    .error-container {
      max-width: 600px;
      padding: 3rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: float 6s ease-in-out infinite;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8rem;
      margin: 0;
      background: linear-gradient(135deg, #7dd3fc, #7c3aed, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #bae6fd;
    }
    p {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #7c3aed, #be185d);
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }
    .btn-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(124, 58, 237, 0.5);
    }
    .astronaut {
      position: absolute;
      font-size: 4rem;
      opacity: 0.2;
      z-index: -1;
      animation: drift 20s linear infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes drift {
      from { transform: translate(-100vw, -100vh) rotate(0deg); }
      to { transform: translate(100vw, 100vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="astronaut"><i class="fa-solid fa-user-astronaut"></i></div>
  <div class="error-container">
    <h1>404</h1>
    <h2>Lost in the Void?</h2>
    <p>The coordinates you entered don't exist in our known universe. You may have slipped through a wormhole or encountered a cosmic glitch.</p>
    <a href="homepage/main.html" class="btn-home"><i class="fa-solid fa-rocket"></i> Return to Base</a>
  </div>
</body>
</html>
