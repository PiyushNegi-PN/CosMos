<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth 8K | CosMos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
    <script src="../homepage/errorHandler.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        canvas { display: block; outline: none; }
        
        .exit-btn {
            position: absolute; top: 30px; left: 30px; z-index: 100;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 10px 20px; border-radius: 30px; color: white;
            text-decoration: none; font-weight: 500; font-size: 14px;
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .exit-btn:hover { background: rgba(56, 189, 248, 0.4); transform: translateY(-2px); }

        #ui-panel {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 16px; padding: 25px;
            color: white; width: 300px; z-index: 100;
        }
        #ui-panel h2 {
            margin: 0 0 15px 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px;
            background: linear-gradient(135deg, #7dd3fc, #3b82f6);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        #ui-panel p { margin: 8px 0; font-size: 14px; color: #cbd5e1; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        #ui-panel p strong { color: #fff; }
        .info-desc {
            font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 15px 0;
            padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px;
            border-left: 3px solid #7dd3fc;
        }
        
        .controls-group { margin-top: 20px; }
        .controls-group label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; color: #fff; margin-bottom: 10px; }
        .btn-action {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 16px; border-radius: 8px; cursor: pointer;
            transition: all 0.3s ease; width: 100%; margin-top: 10px; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .btn-action:hover { background: rgba(56, 189, 248, 0.4); border-color: #7dd3fc; }
        #loading {
            position: absolute; inset: 0; background: #000; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            color: #7dd3fc; font-family: 'Space Grotesk', sans-serif; font-size: 24px; letter-spacing: 2px;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="loading">INITIALIZING ORBIT...</div>
    <a href="../homepage/main.html" class="exit-btn"><i class="fa-solid fa-arrow-left"></i> Return to Hub</a>
    
    <div id="ui-panel">
        <h2>Earth</h2>
        <div class="info-desc">Our home planet—a dynamic world of liquid water oceans, diverse ecosystems, and the only known celestial body to support life.</div>
        <p><span>Diameter</span> <strong>12,742 km</strong></p>
        <p><span>Gravity</span> <strong>9.8 m/s²</strong></p>
        <p><span>Distance from Sun</span> <strong>149.6M km</strong></p>
        <p><span>Surface Temp</span> <strong>-88°C to 58°C</strong></p>
        
        <div class="controls-group">
            <label><input type="checkbox" id="showAsteroids" checked> Track NEO Asteroids</label>
            <label><input type="checkbox" id="autoRotate" checked> Auto Rotation</label>
            <button class="btn-action" id="resetCam">Reset View</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6;
        controls.maxDistance = 60;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(15, 5, 10);
        scene.add(ambientLight, sunLight);

        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(8000 * 3);
        const starColors = new Float32Array(8000 * 3);
        const color = new THREE.Color();
        for(let i=0; i<24000; i+=3) {
            starPos[i] = (Math.random()-0.5) * 1500;
            starPos[i+1] = (Math.random()-0.5) * 1500;
            starPos[i+2] = (Math.random()-0.5) * 1500;
            color.setHSL(Math.random(), 0.5, Math.random() * 0.8 + 0.2);
            starColors[i] = color.r; starColors[i+1] = color.g; starColors[i+2] = color.b;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({size: 0.5, vertexColors: true, transparent: true, opacity: 0.8}));
        scene.add(stars);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('Anonymous');
        
        let planet, clouds;

        // Advanced Earth setup
        const baseUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/';
        Promise.all([
            new Promise(res => textureLoader.load('https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/earthmap1k.jpg', res)),
            new Promise(res => textureLoader.load(baseUrl + 'earth_normal_2048.jpg', res)),
            new Promise(res => textureLoader.load(baseUrl + 'earth_specular_2048.jpg', res)),
            new Promise(res => textureLoader.load(baseUrl + 'earth_clouds_1024.png', res))
        ]).then(([colorTex, normalTex, specTex, cloudTex]) => {
            
            // Earth Group
            planet = new THREE.Group();
            scene.add(planet);

            // Ground
            const geometry = new THREE.SphereGeometry(5, 128, 128);
            const material = new THREE.MeshStandardMaterial({
                map: colorTex,
                normalMap: normalTex,
                roughnessMap: specTex, // Inverts spec logic slightly but works well enough
                metalness: 0.1,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(geometry, material);
            planet.add(ground);

            // Clouds
            const cloudGeo = new THREE.SphereGeometry(5.05, 64, 64);
            const cloudMat = new THREE.MeshLambertMaterial({
                map: cloudTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.8
            });
            clouds = new THREE.Mesh(cloudGeo, cloudMat);
            planet.add(clouds);

            // Atmosphere Glow
            const atmosGeo = new THREE.SphereGeometry(5.15, 64, 64);
            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() { 
                        float intensity = pow(0.65 - dot(vNormal, vec3(0,0,1.0)), 4.0); 
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity; 
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            const atmos = new THREE.Mesh(atmosGeo, atmosMat);
            planet.add(atmos);

            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 1000);
        });

        // Near Earth Objects (Asteroids) - Instanced for Massive Performance Gain
        const asteroidCount = 1000; // Drilled from 50 to 1000 with 0 lag
        const asteroidGeo = new THREE.DodecahedronGeometry(0.08, 0);
        const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
        const asteroidInstancedMesh = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);
        
        const dummy = new THREE.Object3D();
        const asteroidData = [];
        
        for(let i=0; i<asteroidCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const orbitRadius = 7 + Math.random() * 4;
            const y = (Math.random() - 0.5) * 2;
            const speed = 0.001 + Math.random() * 0.005;
            asteroidData.push({ angle, radius: orbitRadius, y, speed });
            
            dummy.position.set(Math.cos(angle)*orbitRadius, y, Math.sin(angle)*orbitRadius);
            dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            dummy.updateMatrix();
            asteroidInstancedMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(asteroidInstancedMesh);

        // UI Event Listeners
        const autoRotate = document.getElementById('autoRotate');
        document.getElementById('resetCam').addEventListener('click', () => {
            camera.position.set(0, 5, 20);
            controls.target.set(0,0,0);
        });
        const showAsteroids = document.getElementById('showAsteroids');
        showAsteroids.addEventListener('change', (e) => {
            asteroidInstancedMesh.visible = e.target.checked;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (planet && autoRotate.checked) {
                planet.rotation.y += 0.001; // Earth
            }
            if (clouds && autoRotate.checked) {
                clouds.rotation.y += 0.0012; // Clouds faster
            }
            stars.rotation.y += 0.0001;

            if (showAsteroids.checked) {
                for(let i=0; i<asteroidCount; i++) {
                    const data = asteroidData[i];
                    data.angle -= data.speed;
                    dummy.position.set(Math.cos(data.angle)*data.radius, data.y, Math.sin(data.angle)*data.radius);
                    dummy.rotation.x += data.speed; dummy.rotation.y += data.speed;
                    dummy.updateMatrix();
                    asteroidInstancedMesh.setMatrixAt(i, dummy.matrix);
                }
                asteroidInstancedMesh.instanceMatrix.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
